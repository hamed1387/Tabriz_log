<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="کافه‌ها و مکان‌هایی که در تبریز تجربه کردیم">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark">
<title>Tabriz Places</title>

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

<header>
  <h1>Tabriz Places</h1>
  <p>کافه‌ها و مکان‌هایی که تجربه کردیم</p>
</header>

<main class="container">

  <div class="toolbar" id="toolbar" hidden>
    <span class="toolbar-label" id="sortLabel">مرتب‌سازی</span>

    <div class="dropdown" id="dropdown">
      <button type="button" class="dropdown-toggle" id="sortButton"
              aria-haspopup="listbox" aria-expanded="false"
              aria-labelledby="sortLabel sortValue">
        <span class="dropdown-value" id="sortValue">بیشترین امتیاز</span>
        <svg class="dropdown-chevron" width="11" height="11" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>

      <ul class="dropdown-menu" id="sortMenu" role="listbox" aria-labelledby="sortLabel" hidden>
        <li class="dropdown-option" role="option" data-value="score-desc" aria-selected="true" tabindex="-1">
          <span>بیشترین امتیاز</span>
          <svg class="check" width="13" height="13" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </li>
        <li class="dropdown-option" role="option" data-value="score-asc" aria-selected="false" tabindex="-1">
          <span>کمترین امتیاز</span>
          <svg class="check" width="13" height="13" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </li>
        <li class="dropdown-option" role="option" data-value="default" aria-selected="false" tabindex="-1">
          <span>ترتیب فایل</span>
          <svg class="check" width="13" height="13" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 6L9 17l-5-5"/>
          </svg>
        </li>
      </ul>
    </div>

    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <p class="status" id="status" role="status">در حال بارگذاری مکان‌ها…</p>

  <section class="places" id="places" aria-label="فهرست مکان‌ها"></section>

</main>

<footer>
  ساخته شده برای ثبت خاطرات تبریز ❤️
</footer>

<noscript>
  <p class="status error">برای نمایش مکان‌ها باید JavaScript در مرورگر فعال باشد.</p>
</noscript>

<script src="assets/js/script.js"></script>
</body>
</html>
